
name: Scheduled Telegram Calls

on:
  repository_dispatch:
    types: [run-scheduled-calls]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-telegram-calls
  cancel-in-progress: false

jobs:
  make-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyrogram tgcrypto pytgcalls static-ffmpeg requests edge-tts groq mutagen ddgs

      - name: Run scheduled calls
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python new.py

      - name: Save updated schedule
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet || (
            git commit -m "Update call schedule status" &&
            git push
          )
