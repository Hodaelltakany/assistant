name: Scheduled AI Call

on:
  # 21:00 UTC = 11:00 PM بتوقيت القاهرة (UTC+2)
  schedule:
  - cron: '55 21 12 11 *'

  # زرار للتشغيل اليدوي الفوري في أي وقت للتجربة
  workflow_dispatch:

jobs:
  make-call:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run AI Voice Assistant
        run: |
          python new.py
