name: Scheduled AI Call

on:
  workflow_dispatch:
    inputs:
      phone:
        description: "رقم المتصل بيها"
        required: true
      time:
        description: "الميعاد HH:MM بتوقيت القاهرة (اختياري)"
        required: false

concurrency:
  group: salma-call
  cancel-in-progress: false

jobs:
  make-call:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AI Voice Assistant
        run: python new.py
        env:
          PHONE: ${{ inputs.phone }}
          CALL_TIME: ${{ inputs.time }}

      - name: Upload call summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-summary
          path: call_summary.txt
          if-no-files-found: ignore
